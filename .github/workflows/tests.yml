name: Run QA Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest-playwright
      - run: playwright install chromium
      - run: pytest test_saucedemo.py test_database.py -v